<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#059669">
    <title>Sem ligação — StopCheck</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #050a08;
            color: #f8fafc;
            padding: 1.5rem;
        }
        .container { text-align: center; max-width: 22rem; }
        .logo {
            display: inline-flex;
            width: 4rem;
            height: 4rem;
            border-radius: 1rem;
            background: #10b981;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
        }
        h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
        p { color: #94a3b8; margin-bottom: 2rem; line-height: 1.5; }
        button {
            padding: 0.75rem 1.5rem;
            background: #10b981;
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { background: #059669; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">S</div>
        <h1>Sem ligação à internet</h1>
        <p>Verifique a sua ligação e tente novamente.</p>
        <button type="button" onclick="window.location.reload()">Tentar novamente</button>
    </div>
</body>
</html>
