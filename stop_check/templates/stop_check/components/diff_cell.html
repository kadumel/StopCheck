<div class="flex flex-col items-center gap-0.5">
    <span class="inline-flex px-2 py-0.5 rounded-full text-xs font-bold {% if value > 0 %}bg-emerald-100 text-emerald-700{% elif value < 0 %}bg-red-100 text-red-700{% else %}bg-slate-100 text-slate-500{% endif %}">
        {% if value > 0 %}+{% endif %}{{ value }}
    </span>
    {% if amount is not None %}
    <span class="text-xs font-semibold {% if amount > 0 %}text-emerald-600{% elif amount < 0 %}text-red-600{% else %}text-slate-400{% endif %}">
        {% if amount > 0 %}+{% endif %}{{ amount|floatformat:2 }} €
    </span>
    {% endif %}
</div>
