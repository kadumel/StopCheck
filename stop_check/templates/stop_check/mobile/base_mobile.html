<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#059669">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="manifest" href="/static/manifest.json">
    <title>{% block title %}StopCheck Motorista{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { brand: { 500: '#10b981', 600: '#059669', 700: '#047857' } } } } }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .tap-btn { touch-action: manipulation; user-select: none; }
        .tap-btn:active { transform: scale(0.96); }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen pb-24">
    <header class="sticky top-0 z-10 bg-slate-900/95 backdrop-blur border-b border-slate-700 px-4 py-4">
        <div class="flex items-center justify-between max-w-lg mx-auto">
            <div>
                <p class="text-xs text-slate-400">StopCheck</p>
                <h1 class="font-bold text-lg">{{ driver.name }}</h1>
            </div>
            <a href="{% url 'logout' %}" class="text-sm text-slate-400 hover:text-white">Sair</a>
        </div>
    </header>
    <main class="max-w-lg mx-auto px-4 py-4">
        {% if messages %}
        {% for message in messages %}
        <div class="mb-4 px-4 py-3 rounded-xl bg-brand-600/20 text-brand-300 text-sm">{{ message }}</div>
        {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </main>
    <nav class="fixed bottom-0 left-0 right-0 bg-slate-800 border-t border-slate-700 safe-area-pb">
        <div class="max-w-lg mx-auto flex">
            <a href="{% url 'driver_app' %}" class="flex-1 py-4 text-center text-sm {% if request.resolver_match.url_name == 'driver_app' %}text-brand-400 font-semibold{% else %}text-slate-400{% endif %}">
                Registar
            </a>
            <a href="{% url 'driver_history' %}" class="flex-1 py-4 text-center text-sm {% if request.resolver_match.url_name == 'driver_history' %}text-brand-400 font-semibold{% else %}text-slate-400{% endif %}">
                Histórico
            </a>
        </div>
    </nav>
    <script>
    let driverCsrfToken = '';

    async function refreshDriverCsrf() {
        const res = await fetch('{% url "driver_csrf" %}', {
            credentials: 'same-origin',
            cache: 'no-store',
        });
        if (!res.ok) return false;
        const data = await res.json();
        driverCsrfToken = data.csrfToken || '';
        document.querySelectorAll('[name=csrfmiddlewaretoken]').forEach((el) => {
            el.value = driverCsrfToken;
        });
        return !!driverCsrfToken;
    }

    function getCsrfToken() {
        return driverCsrfToken || document.querySelector('[name=csrfmiddlewaretoken]')?.value || '';
    }
    </script>
    {% block extra_js %}{% endblock %}
    <script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then((regs) => {
            regs.forEach((reg) => reg.unregister());
        });
    }
    refreshDriverCsrf();
    </script>
</body>
</html>
